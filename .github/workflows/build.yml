name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install daemon dependencies
        run: python -m pip install -r Resources/python/requirements.txt
      - name: Daemon unit tests
        run: python -m unittest discover -s tests -p 'test_daemon.py' -v

  build:
    runs-on: macos-latest
    needs: python-tests
    permissions:
      contents: write   # нужно для публикации релиза по тегу
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build (Release, ad-hoc signed)
        run: |
          xcodegen generate
          xcodebuild -project ATVRemote.xcodeproj -scheme ATVRemote -configuration Release \
            -derivedDataPath build/ci \
            CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=YES CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" \
            build

      - name: Check tag matches MARKETING_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*MARKETING_VERSION:[[:space:]]*"\{0,1\}\([0-9][0-9A-Za-z.+-]*\)"\{0,1\}.*/\1/p' project.yml | head -n1)"
          if [ "v$VERSION" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} != MARKETING_VERSION v$VERSION in project.yml" >&2
            exit 1
          fi

      - name: Build universal release archive
        if: startsWith(github.ref, 'refs/tags/v')
        run: scripts/release.sh

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
