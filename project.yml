name: ATVRemote
options:
  bundleIdPrefix: local.atvremote
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # Локализация: английский — язык разработки, русский — перевод (String Catalogs).
  developmentLanguage: en
  knownRegions:
    - en
    - ru
    - Base
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ad-hoc подпись: платный аккаунт разработчика не нужен.
    # Если хотите подписывать «Personal Team» — смените CODE_SIGN_IDENTITY на "Apple Development"
    # и укажите DEVELOPMENT_TEAM в Xcode (Signing & Capabilities).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "YES"
    CODE_SIGNING_ALLOWED: "YES"
    DEVELOPMENT_TEAM: ""
    # Песочница выключена: приложению нужны сеть, venv в ~/Library и запуск python.
    ENABLE_APP_SANDBOX: "NO"
    ENABLE_HARDENED_RUNTIME: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    GENERATE_INFOPLIST_FILE: "NO"

targets:
  ATVRemote:
    type: application
    platform: macOS
    sources:
      - path: Sources/ATVRemote
      # Каталог ресурсов: AppIcon + значки строки меню (генерируются scripts/make_icon.py)
      - path: Resources/Assets.xcassets
      # String Catalogs: интерфейс (en → ru) и Info.plist (описание доступа к сети)
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      # Папка целиком копируется в ATVRemote.app/Contents/Resources/python
      - path: Resources/python
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: ATVRemote
        PRODUCT_BUNDLE_IDENTIFIER: local.atvremote.ATVRemote
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Config/Info.plist
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: ATVRemote
        CFBundleDevelopmentRegion: "$(DEVELOPMENT_LANGUAGE)"
        CFBundleLocalizations:
          - en
          - ru
        CFBundleDisplayName: ATV Remote
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.utilities
        # Приложение живёт только в строке меню (без значка в Dock)
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Vladimir Kosarev. MIT License. Powered by pyatv."
        # Доступ к локальной сети (mDNS-поиск и управление Apple TV)
        NSLocalNetworkUsageDescription: "ATV Remote looks for Apple TVs on your local network and controls them."
        NSBonjourServices:
          - _companion-link._tcp
          - _airplay._tcp
          - _raop._tcp
          - _mediaremotetv._tcp
          - _touch-able._tcp
          - _appletv-v2._tcp
          - _hscp._tcp
          - _sleep-proxy._udp
